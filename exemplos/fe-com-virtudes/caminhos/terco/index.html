<script type="application/json" id="originais">{"myst": [["A Anunciação (ou A Encarnação do Senhor).", "A visitação de Nossa Senhora à sua prima Santa Isabel.", "O nascimento do Filho de Deus em Belém.", "A purificação de Nossa Senhora (ou A Apresentação do Senhor).", "O Menino‑Deus perdido e achado no Templo."], ["O batismo do Senhor no Jordão.", "A auto‑revelação de Cristo nas bodas de Caná.", "O anúncio do Reino de Deus, convidando à conversão.", "A Transfiguração do Senhor.", "A instituição da Santíssima Eucaristia."], ["A oração no Horto.", "A flagelação do Senhor.", "A coroação de espinhos.", "A Cruz às costas.", "Jesus morre na Cruz."], ["A Ressurreição do Senhor.", "A Ascensão do Senhor aos céus.", "A vinda do Espírito Santo.", "A Assunção de Nossa Senhora.", "A coroação de Maria Santíssima."]], "intro": "\r\n\u003cp>Repetir 3x seguidas esta primeira parte:\u003c/p>\r\n\u003cp>℣. \u003cstrong>Graças e louvores sejam dados a todo momento.\u003c/strong>\u003cbr />℟. Ao santíssimo e diviníssimo Sacramento.\u003cbr />\u003cbr />\u003cstrong>Pai nosso que estais nos céus, santificado seja o vosso nome; venha a nós o vosso reino, seja feita a vossa vontade assim na terra como no céu.\u003c/strong>\u003cbr />O pão nosso de cada dia nos dai hoje; perdoai‑nos as nossas ofensas assim como nós perdoamos a quem nos tem ofendido, e não nos deixeis cair em tentação, mas livrai‑nos do mal. Amém.\u003cbr />\u003cstrong>\u003cbr />Ave, Maria, cheia de graça, o Senhor é convosco, bendita sois vós entre as mulheres e bendito é o fruto do vosso ventre, Jesus.\u003c/strong>\u003cbr />Santa Maria, Mãe de Deus, rogai por nós, pecadores, agora e na hora da nossa morte. Amém.\u003cbr />\u003cstrong>\u003cbr />Glória ao Pai, ao Filho e ao Espírito Santo.\u003c/strong> \u003cbr />Como era no princípio, agora e sempre. Amém.\u003cbr />\u003cbr />\u003cem>Agora reza-se o que segue:\u003cbr />\u003c/em>\u003cstrong>Comunhão espiritual\u003c/strong>: Eu quisera, Senhor, receber‑vos com aquela pureza, humildade e devoção com que vos recebeu a vossa Santíssima Mãe, com o espírito e o fervor dos Santos.\u003cbr />\u003cbr />℣.\u003cstrong> Pelo sinal † da Santa Cruz, livrai‑nos Deus, † Nosso Senhor, dos nossos † inimigos. Em nome do Pai, e do Filho, † e do Espírito Santo. Amém.\u003c/strong>\u003cbr />\u003cbr />\u003cstrong>Ato de contrição.\u003c/strong>\u003cbr />\u003cbr />℣.\u003cstrong> Glória ao Pai, ao Filho e ao Espírito Santo.\u003c/strong>\u003cbr />℟. Como era no princípio, agora e sempre. Amém.\u003c/p>\r\n\u003cp>\u003cem>Agora, de acordo com o dia da semana, rezassem-se os cinco mistérios correspondentes. Em cada dezena (ou mistério), reza-se um \u003c/em>\u003cem>Pai‑Nosso\u003c/em>\u003cem>, dez \u003c/em>\u003cem>Ave‑Marias \u003c/em>\u003cem>e um \u003c/em>\u003cem>Glória\u003c/em>\u003cem>, seguidos da seguinte jaculatória:\u003cbr />\u003c/em>\u003cstrong>Ó meu Jesus, perdoai‑nos, livrai‑nos do fogo do inferno. Levai as almas todas para o céu e socorrei principalmente as que mais precisarem.\u003c/strong>\u003c/p>\r\n", "end": "\r\n\u003cp>&nbsp;\u003c/p>\r\n\u003cp>&nbsp;\u003c/p>\r\n\u003cp>\u003cem>Em seguida, recitam‑se as seguintes orações:\u003cbr />\u003cbr />\u003c/em>\u003cstrong>Ave, Maria, Filha de Deus Pai, cheia de graça, o Senhor é convosco, bendita sois vós entre as mulheres e bendito é o fruto do vosso ventre, Jesus.\u003c/strong>\u003cstrong>\u003cbr />\u003c/strong>Santa Maria, Mãe de Deus, rogai por nós, pecadores, agora e na hora da nossa morte. Amém.\u003c/p>\r\n\u003cp>\u003cstrong>Ave, Maria, Mãe de Deus Filho, cheia de graça, o Senhor é convosco, bendita sois vós entre as mulheres e bendito é o fruto do vosso ventre, Jesus.\u003c/strong>\u003cstrong>\u003cbr />\u003c/strong>Santa Maria, Mãe de Deus, rogai por nós, pecadores, agora e na hora da nossa morte. Amém.\u003c/p>\r\n\u003cp>\u003cstrong>Ave, Maria, Esposa de Deus Espírito Santo, cheia de graça, o Senhor é convosco, bendita sois vós entre as mulheres e bendito é o fruto do vosso ventre, Jesus.\u003c/strong>\u003cstrong>\u003cbr />\u003c/strong>Santa Maria, Mãe de Deus, rogai por nós, pecadores, agora e na hora da nossa morte. Amém.\u003c/p>\r\n\u003cp>℣.\u003cstrong> Senhor, tende piedade de nós,\u003c/strong>\u003cstrong>\u003cbr />\u003c/strong>℟. Senhor, tende piedade de nós.\u003cbr />℣.\u003cstrong> Jesus Cristo, tende piedade de nós,\u003c/strong>\u003cstrong>\u003cbr />\u003c/strong>℟. Jesus Cristo, tende piedade de nós.\u003cbr />℣.\u003cstrong> Senhor, tende piedade de nós,\u003c/strong>\u003cstrong>\u003cbr />\u003c/strong>℟. Senhor, tende piedade de nós.\u003cbr />℣.\u003cstrong> Jesus Cristo, ouvi‑nos,\u003c/strong>\u003cstrong>\u003cbr />\u003c/strong>℟. Jesus Cristo, ouvi-nos.\u003cbr />℣.\u003cstrong> Jesus Cristo, atendei‑nos,\u003c/strong>\u003cstrong>\u003cbr />\u003c/strong>℟. Jesus Cristo, atendei-nos.\u003cbr />℣.\u003cstrong> Deus Pai dos céus,\u003c/strong>\u003cstrong>\u003cbr />\u003c/strong>℟. Tende piedade de nós.\u003cbr />℣.\u003cstrong> Deus Filho Redentor do mundo,\u003c/strong>\u003cstrong>\u003cbr />\u003c/strong>℟. Tende piedade de nós.\u003cbr />℣.\u003cstrong> Deus Espírito Santo,\u003c/strong>\u003cstrong>\u003cbr />\u003c/strong>℟. Tende piedade de nós.\u003cbr />℣.\u003cstrong> Santíssima Trindade, que sois um só Deus,\u003c/strong>\u003cstrong>\u003cbr />\u003c/strong>℟. Tende piedade de nós.\u003c/p>\r\n\u003cp>℣.\u003cstrong> Santa Maria,\u003c/strong>\u003cstrong>\u003cbr />\u003c/strong>℟. rogai por nós. (responder nas próximas invocações)\u003cbr />℣.\u003cstrong> Santa Mãe de Deus,\u003c/strong>\u003cstrong>\u003cbr />\u003c/strong>℣.\u003cstrong> Santa Virgem das virgens,\u003c/strong>\u003cstrong>\u003cbr />\u003c/strong>℣.\u003cstrong> Mãe de Jesus Cristo,\u003c/strong>\u003cstrong>\u003cbr />\u003c/strong>℣.\u003cstrong> Mãe da Igreja,\u003c/strong>\u003cstrong>\u003cbr />\u003c/strong>℣.\u003cstrong> Mãe da misericórdia,\u003cbr />\u003c/strong>℣.\u003cstrong> Mãe da divina graça,\u003c/strong>\u003cstrong>\u003cbr />\u003c/strong>℣.\u003cstrong> Mãe da esperança,\u003c/strong>\u003cbr />℣.\u003cstrong> Mãe puríssima,\u003c/strong>\u003cstrong>\u003cbr />\u003c/strong>℣.\u003cstrong> Mãe castíssima,\u003c/strong>\u003cbr />℣.\u003cstrong> Mãe imaculada,\u003c/strong>\u003cstrong>\u003cbr />\u003c/strong>℣.\u003cstrong> Mãe intacta,\u003c/strong>\u003cstrong>\u003cbr />\u003c/strong>℣.\u003cstrong> Mãe amável,\u003c/strong>\u003cstrong>\u003cbr />\u003c/strong>℣.\u003cstrong> Mãe admirável,\u003c/strong>\u003cstrong>\u003cbr />\u003c/strong>℣.\u003cstrong> Mãe do bom conselho,\u003c/strong>\u003cstrong>\u003cbr />\u003c/strong>℣.\u003cstrong> Mãe do Criador,\u003c/strong>\u003cstrong>\u003cbr />\u003c/strong>℣.\u003cstrong> Mãe do Salvador,\u003c/strong>\u003cstrong>\u003cbr />\u003c/strong>℣.\u003cstrong> Virgem prudentíssima,\u003c/strong>\u003cstrong>\u003cbr />\u003c/strong>℣.\u003cstrong> Virgem veneranda,\u003c/strong>\u003cstrong>\u003cbr />\u003c/strong>℣.\u003cstrong> Virgem digna de louvor,\u003c/strong>\u003cstrong>\u003cbr />\u003c/strong>℣.\u003cstrong> Virgem poderosa,\u003c/strong>\u003cstrong>\u003cbr />\u003c/strong>℣.\u003cstrong> Virgem clemente,\u003c/strong>\u003cstrong>\u003cbr />\u003c/strong>℣.\u003cstrong> Virgem fiel,\u003c/strong>\u003cstrong>\u003cbr />\u003c/strong>℣.\u003cstrong> Espelho da justiça,\u003c/strong>\u003cstrong>\u003cbr />\u003c/strong>℣.\u003cstrong> Sede da Sabedoria,\u003c/strong>\u003cstrong>\u003cbr />\u003c/strong>℣.\u003cstrong> Causa da nossa alegria,\u003c/strong>\u003cstrong>\u003cbr />\u003c/strong>℣.\u003cstrong> Vaso espiritual,\u003c/strong>\u003cstrong>\u003cbr />\u003c/strong>℣.\u003cstrong> Vaso honorável,\u003c/strong>\u003cstrong>\u003cbr />\u003c/strong>℣.\u003cstrong> Vaso insigne de devoção,\u003c/strong>\u003cstrong>\u003cbr />\u003c/strong>℣.\u003cstrong> Rosa mística,\u003c/strong>\u003cbr />℣.\u003cstrong> Torre de Davi,\u003c/strong>\u003cstrong>\u003cbr />\u003c/strong>℣.\u003cstrong> Torre de marfim,\u003c/strong>\u003cstrong>\u003cbr />\u003c/strong>℣.\u003cstrong> Casa de ouro,\u003c/strong>\u003cstrong>\u003cbr />\u003c/strong>℣.\u003cstrong> Arca da aliança,\u003c/strong>\u003cstrong>\u003cbr />\u003c/strong>℣.\u003cstrong> Porta do céu,\u003c/strong>\u003cstrong>\u003cbr />\u003c/strong>℣.\u003cstrong> Estrela da manhã,\u003c/strong>\u003cstrong>\u003cbr />\u003c/strong>℣.\u003cstrong> Saúde dos enfermos,\u003c/strong>\u003cstrong>\u003cbr />\u003c/strong>℣.\u003cstrong> Refúgio dos pecadores,\u003c/strong>\u003cstrong>\u003cbr />\u003c/strong>℣.\u003cstrong> Consolo dos migrantes,\u003c/strong>\u003cbr />℣.\u003cstrong> Consoladora dos aflitos,\u003c/strong>\u003cstrong>\u003cbr />\u003c/strong>℣.\u003cstrong> Auxílio dos cristãos,\u003c/strong>\u003cstrong>\u003cbr />\u003c/strong>℣.\u003cstrong> Rainha dos Anjos,\u003c/strong>\u003cstrong>\u003cbr />\u003c/strong>℣.\u003cstrong> Rainha dos Patriarcas,\u003c/strong>\u003cstrong>\u003cbr />\u003c/strong>℣.\u003cstrong> Rainha dos Profetas,\u003c/strong>\u003cstrong>\u003cbr />\u003c/strong>℣.\u003cstrong> Rainha dos Apóstolos,\u003c/strong>\u003cstrong>\u003cbr />\u003c/strong>℣.\u003cstrong> Rainha dos Mártires,\u003c/strong>\u003cstrong>\u003cbr />\u003c/strong>℣.\u003cstrong> Rainha dos Confessores,\u003c/strong>\u003cstrong>\u003cbr />\u003c/strong>℣.\u003cstrong> Rainha das Virgens,\u003c/strong>\u003cstrong>\u003cbr />\u003c/strong>℣.\u003cstrong> Rainha de todos os Santos,\u003c/strong>\u003cstrong>\u003cbr />\u003c/strong>℣.\u003cstrong> Rainha concebida sem pecado original,\u003c/strong>\u003cstrong>\u003cbr />\u003c/strong>℣.\u003cstrong> Rainha assunta aos céus,\u003c/strong>\u003cstrong>\u003cbr />\u003c/strong>℣.\u003cstrong> Rainha do Santíssimo Rosário,\u003c/strong>\u003cstrong>\u003cbr />\u003c/strong>℣.\u003cstrong> Rainha da Família,\u003c/strong>\u003cstrong>\u003cbr />\u003c/strong>℣. \u003cstrong>Rainha da Paz,\u003c/strong>\u003cstrong>\u003cbr />\u003c/strong>\u003cbr />\u003cem>Batendo no peito a cada invocação:\u003cbr />\u003c/em>℣.\u003cstrong> Cordeiro de Deus, que tirais os pecados do mundo,\u003c/strong>\u003cstrong>\u003cbr />\u003c/strong>℟. Perdoai-nos, Senhor.\u003cbr />℣.\u003cstrong> Cordeiro de Deus, que tirais os pecados do mundo,\u003c/strong>\u003cstrong>\u003cbr />\u003c/strong>℟. Ouvi-nos, Senhor.\u003cbr />℣.\u003cstrong> Cordeiro de Deus, que tirais os pecados do mundo,\u003c/strong>\u003cstrong>\u003cbr />\u003c/strong>℟. tende piedade de nós.\u003c/p>\r\n\u003cp>\u003cstrong>À vossa proteção nós recorremos, Santa Mãe de Deus; não desprezeis as súplicas que em nossas necessidades vos dirigimos, mas livrai-nos sempre de todos os perigos, ó Virgem gloriosa e bendita.\u003c/strong>℣.\u003cstrong> Rogai por nós, Santa Mãe de Deus.\u003c/strong>\u003cstrong>\u003cbr />\u003c/strong>℟. Para que sejamos dignos das promessas de Cristo.\u003c/p>\r\n\u003cp>\u003cstrong>Oremos. Infundi, Senhor, nós vos pedimos, em nossas almas a vossa graça, para que nós, que conhecemos pela Anunciação do Anjo a Encarnação de Jesus Cristo, vosso Filho, cheguemos por sua Paixão e sua Cruz à glória da ressurreição. Pelo mesmo Jesus Cristo, Senhor Nosso.\u003c/strong>℟. Amém.\u003c/p>\r\n\u003cp>\u003cstrong>Pelas necessidades da igreja e do estado.\u003c/strong>\u003cstrong>\u003cbr />\u003c/strong>Reza‑se um \u003cem>Pai‑Nosso\u003c/em>, uma \u003cem>Ave‑Maria\u003c/em> e um \u003cem>Glória\u003c/em>.\u003cbr />\u003cstrong>Pela pessoa e intenções do senhor bispo desta diocese.\u003c/strong>\u003cstrong>\u003cbr />\u003c/strong>Reza‑se um \u003cem>Pai‑Nosso\u003c/em>, uma \u003cem>Ave‑Maria\u003c/em> e um \u003cem>Glória\u003c/em>.\u003cbr />\u003cstrong>Pelas benditas almas do purgatório.\u003c/strong>\u003cstrong>\u003cbr />\u003c/strong>Reza‑se um \u003cem>Pai‑Nosso\u003c/em>, uma \u003cem>Ave‑Maria,\u003c/em> mas não se reza o \u003cem>Glória\u003c/em>. No seu lugar, diz-se:\u003cbr />℣.\u003cstrong> Descansem em paz.\u003c/strong>\u003cstrong>\u003cbr />\u003c/strong>℟. Amém.\u003c/p>\r\n", "prayers": ["\u003cstrong>Pai nosso que estais nos céus, santificado seja o vosso nome; venha a nós o vosso reino, seja feita a vossa vontade assim na terra como no céu.\u003c/strong>\u003cbr />O pão nosso de cada dia nos dai hoje; perdoai‑nos as nossas ofensas assim como nós perdoamos a quem nos tem ofendido, e não nos deixeis cair em tentação, mas livrai‑nos do mal. Amém.", "\u003cstrong>Ave, Maria, cheia de graça, o Senhor é convosco, bendita sois vós entre as mulheres e bendito é o fruto do vosso ventre, Jesus.\u003c/strong>\u003cbr />Santa Maria, Mãe de Deus, rogai por nós, pecadores, agora e na hora da nossa morte. Amém.", "\u003cstrong>Glória ao Pai, ao Filho e ao Espírito Santo.\u003c/strong> \u003cbr />Como era no princípio, agora e sempre. Amém."], "jac": "Ó meu Jesus, perdoai‑nos, livrai‑nos do fogo do inferno. Levai as almas todas para o céu e socorrei principalmente as que mais precisarem."}</script>
<script type="application/json" id="leituras">[[["No sexto mês, o anjo Gabriel foi enviado por Deus a uma cidade da Galiléia, chamada Nazaré, a uma virgem desposada com um homem que se chamava José, da casa de Davi e o nome da virgem era Maria", "Lc 1, 26-27", "https://www.vatican.va/special/rosary/documents/misteri_gaudiosi_po.html"], ["Naqueles dias, Maria se levantou e foi às pressas às montanhas, a uma cidade de Judá. Entrou em casa de Zacarias e saudou Isabel. Ora, apenas Isabel ouviu a saudação de Maria, a criança estremeceu no seu seio; e Isabel ficou cheia do Espírito Santo. E exclamou em alta voz: \"Bendita és tu entre as mulheres e bendito é o fruto do teu ventre\"", "Lc 1, 39-42", "https://www.vatican.va/special/rosary/documents/misteri_gaudiosi_po.html"], ["Naqueles tempos apareceu um decreto de César Augusto, ordenando o recenseamento de toda a terra. Este recenseamento foi feito antes do governo de Quirino, na Síria. Todos iam alistar-se, cada um na sua cidade. Também José subiu da Galiléia, da cidade de Nazaré, à Judéia, à Cidade de Davi, chamada Belém, porque era da casa e família de Davi, para se alistar com a sua esposa Maria, que estava grávida. Estando eles ali, completaram-se os dias dela. E deu à luz seu filho primogênito, e, envolvendo-o em faixas, reclinou-o num presépio; porque não havia lugar para eles na hospedaria", "Lc 2,1-7", "https://www.vatican.va/special/rosary/documents/misteri_gaudiosi_po.html"], ["Completados que foram os oito dias para ser circuncidado o menino, foi-lhe posto o nome de Jesus, como lhe tinha chamado o anjo, antes de ser concebido no seio materno. Concluídos os dias da sua purificação segundo a Lei de Moisés, levaram-no a Jerusalém para o apresentar ao Senhor, conforme o que está escrito na lei do Senhor: Todo primogênito do sexo masculino será consagrado ao Senhor ; e para oferecerem o sacrifício prescrito pela lei do Senhor, um par de rolas ou dois pombinhos .", "Lc 2, 21-24", "https://www.vatican.va/special/rosary/documents/misteri_gaudiosi_po.html"], ["Seus pais iam todos os anos a Jerusalém para a festa da Páscoa. Tendo ele atingido doze anos, subiram a Jerusalém, segundo o costume da festa. Acabados os dias da festa, quando voltavam, ficou o menino Jesus em Jerusalém, sem que os seus pais o percebessem... Três dias depois o acharam no templo, sentado no meio dos doutores, ouvindo-os e interrogando-os. Todos os que o ouviam estavam maravilhados da sabedoria de suas respostas", "Lc 2, 41-47", "https://www.vatican.va/special/rosary/documents/misteri_gaudiosi_po.html"]], [["Depois que Jesus foi batizado, saiu logo da água. Eis que os céus se abriram e viu descer sobre ele, em forma de pomba, o Espírito de Deus. E do céu baixou uma voz: \"Eis meu Filho muito amado em quem ponho minha afeição\"", "Mt 3,16-17", "https://www.vatican.va/special/rosary/documents/misteri_luminosi_po.html"], ["Três dias depois, celebravam-se bodas em Caná da Galiléia, e achava-se ali a mãe de Jesus. Também foram convidados Jesus e os seus discípulos. Como viesse a faltar vinho, a mãe de Jesus disse-lhe: \"Eles já não têm vinho\". Respondeu-lhe Jesus: \"Mulher, isso compete a nós? Minha hora ainda não chegou\". Disse, então, sua mãe aos serventes: \"Fazei o que ele vos disser\"", "Jo 2, 1-5", "https://www.vatican.va/special/rosary/documents/misteri_luminosi_po.html"], ["Completou-se o tempo e o Reino de Deus está próximo; fazei penitência e crede no Evangelho", "Mc 1, 15", "https://www.vatican.va/special/rosary/documents/misteri_luminosi_po.html"], ["Seis dias depois, Jesus tomou consigo Pedro, Tiago e João, seu irmão, e conduziu-os à parte a uma alta montanha. Lá se transfigurou na presença deles: seu rosto brilhou como o sol, suas vestes tornaram-se resplandecentes de brancura", "Mt 17, 1-2", "https://www.vatican.va/special/rosary/documents/misteri_luminosi_po.html"], ["Durante a refeição, Jesus tomou o pão, benzeu-o, partiu-o e o deu aos discípulos, dizendo: \"Tomai e comei, isto é meu corpo\"", "Mt 26, 26", "https://www.vatican.va/special/rosary/documents/misteri_luminosi_po.html"]], [["Retirou-se Jesus com eles para um lugar chamado Getsêmani e disse-lhes: \"Assentai-vos aqui, enquanto eu vou ali orar\". E, tomando consigo Pedro e os dois filhos de Zebedeu, começou a entristecer-se e a angustiar-se. Disse-lhes, então: \"Minha alma está triste até a morte. Ficai aqui e vigiai comigo\". Adiantou-se um pouco e, prostrando-se com a face por terra, assim rezou: \"Meu Pai, se é possível, afasta de mim este cálice! Todavia não se faça o que eu quero, mas sim o que tu queres\"", "Mt 26, 36-39", "https://www.vatican.va/special/rosary/documents/misteri_dolorosi_po.html"], ["Então lhes soltou Barrabás; mas a Jesus mandou açoitar, e o entregou para ser crucificado", "Mt 27,26", "https://www.vatican.va/special/rosary/documents/misteri_dolorosi_po.html"], ["Os soldados do governador conduziram Jesus para o pretório e rodearam-no com todo o pelotão. Arrancaram-lhe as vestes e colocaram-lhe um manto escarlate. Depois, trançaram uma coroa de espinhos, meteram-lha na cabeça e puseram-lhe na mão uma vara. Dobrando os joelhos diante dele, diziam com escárnio: \"Salve, rei dos judeus!\"", "Mt 27, 27-29", "https://www.vatican.va/special/rosary/documents/misteri_dolorosi_po.html"], ["Passava por ali certo homem de Cirene, chamado Simão, que vinha do campo, pai de Alexandre e de Rufo, e obrigaram-no a que lhe levasse a cruz. Conduziram Jesus ao lugar chamado Gólgota, que quer dizer lugar do crânio", "Mc 15, 21-22", "https://www.vatican.va/special/rosary/documents/misteri_dolorosi_po.html"], ["Chegados que foram ao lugar chamado Calvário, ali o crucificaram, como também os ladrões, um à direita e outro à esquerda. E Jesus dizia: \"Pai, perdoa-lhes; porque não sabem o que fazem\"... Era quase à hora sexta e em toda a terra houve trevas até a hora nona. Escureceu-se o sol e o véu do templo rasgou-se pelo meio. Jesus deu então um grande brado e disse: \" Pai, nas tuas mãos entrego o meu espírito \". E, dizendo isso, expirou", "Lc 23, 33-46", "https://www.vatican.va/special/rosary/documents/misteri_dolorosi_po.html"]], [["No primeiro dia da semana, muito cedo, dirigiram-se ao sepulcro com os aromas que haviam preparado. Acharam a pedra removida longe da abertura do sepulcro. Entraram, mas não encontraram o corpo do Senhor Jesus. Não sabiam elas o que pensar, quando apareceram em frente delas dois personagens com vestes resplandecentes. Como estivessem amedrontadas e voltassem o rosto para o chão, disseram-lhes eles: \"Por que buscais entre os mortos aquele que está vivo? Não está aqui, mas ressuscitou\"", "Lc 24, 1-6", "https://www.vatican.va/special/rosary/documents/misteri_gloriosi_po.html"], ["Depois que o Senhor Jesus lhes falou, foi levado ao céu e está sentado à direita de Deus", "Mc 16, 19", "https://www.vatican.va/special/rosary/documents/misteri_gloriosi_po.html"], ["Chegando o dia de Pentecostes, estavam todos reunidos no mesmo lugar. De repente, veio do céu um ruído, como se soprasse um vento impetuoso, e encheu toda a casa onde estavam sentados. Apareceu-lhes então uma espécie de línguas de fogo que se repartiram e pousaram sobre cada um deles. Ficaram todos cheios do Espírito Santo e começaram a falar em línguas, conforme o Espírito Santo lhes concedia que falassem", "At 2, 1-4", "https://www.vatican.va/special/rosary/documents/misteri_gloriosi_po.html"], ["Por isto, desde agora, me proclamarão bem-aventurada todas as gerações, porque realizou em mim maravilhas aquele que é poderoso e cujo nome é Santo", "Lc 1, 48-49", "https://www.vatican.va/special/rosary/documents/misteri_gloriosi_po.html"], ["Apareceu em seguida um grande sinal no céu: uma Mulher revestida do sol, a lua debaixo dos seus pés e na cabeça uma coroa de doze estrelas", "Ap 12, 1", "https://www.vatican.va/special/rosary/documents/misteri_gloriosi_po.html"]]]</script>
<script>
const readings=JSON.parse(document.querySelector("#leituras").textContent);
const d=JSON.parse(document.querySelector('#originais').textContent), days=['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'], names=['Gozosos','Luminosos','Dolorosos','Gloriosos'], types=[3,0,2,3,1,2,0];
const today=days.findIndex(x=>x.toLowerCase()===new Intl.DateTimeFormat('pt-BR',{weekday:'long',timeZone:'America/Sao_Paulo'}).format(new Date()));
const menu=document.querySelector('#dias'), reading=document.querySelector('#leitura'), beads=document.querySelector('.beads'), title=document.querySelector('#etapa'), ctx=document.querySelector('#contexto'), text=document.querySelector('#texto'), prev=document.querySelector('#prev'), next=document.querySelector('#next');
let lastDay=-1, focus=false;
const go=(day,i)=>{focus=true;location.hash='dia-'+day+'-conta-'+i;};
for(const day of [1,2,3,4,5,6,0]){
 const li=document.createElement('li'),b=document.createElement('button'),sub=document.createElement('small');b.type='button';b.textContent=days[day]+(day===today?' · Hoje':'');b.classList.toggle('today',day===today);sub.textContent='Mistérios '+names[types[day]];b.append(sub);b.onclick=()=>go(day,0);li.append(b);menu.querySelector('ul.days').append(li);
}
function route(){
 const m=location.hash.match(/^#dia-([0-6])-conta-(\d+)$/);
 if(!m){menu.hidden=false;reading.hidden=true;return;}
 const day=Number(m[1]), kind=types[day];
 const seq=[['Início',d.intro,'cross','']];
 d.myst[kind].forEach((m,j)=>{
 const label=(j+1)+'º mistério · '+m;
 seq.push(['Pai-Nosso',d.prayers[0],'big',label,readings[kind][j]]);
 for(let k=1;k<=10;k++)seq.push(['Ave-Maria · '+k+' de 10',d.prayers[1],'',label]);
 seq.push(['Glória e jaculatória',d.prayers[2]+'<p>'+d.jac+'</p>','big',label]);
 });
 seq.push(['Ladainha e orações finais',d.end,'cross','']);
 const i=Math.min(Number(m[2]),seq.length-1);
 menu.hidden=true;reading.hidden=false;
 if(lastDay!==day){beads.replaceChildren(...seq.map((step,j)=>{const li=document.createElement('li'),s=document.createElement('span');li.className=step[2];if(step[2]==='cross')s.textContent='†';li.append(s);return li}));lastDay=day;}
 [...beads.children].forEach((li,j)=>{li.classList.toggle('active',j===i);li.classList.toggle('done',j<i);});
 const bead=beads.children[i];beads.scrollTop=bead.offsetTop-beads.clientHeight/2+bead.offsetHeight/2;
 ctx.textContent='Mistérios '+names[kind]+(seq[i][3]?' · '+seq[i][3]:'');title.textContent=seq[i][0];text.innerHTML=seq[i][1];
 if(seq[i][4]){
  const [verse,ref,url]=seq[i][4], section=document.createElement('section'), head=document.createElement('h3'), quote=document.createElement('blockquote'), source=document.createElement('a'), prayer=document.createElement('h3');
  section.className='reading-verse';head.textContent='Leitura para meditar';
  quote.textContent=verse;source.href=url;source.textContent=ref+' · Santa Sé ↗';
  section.append(head,quote,source);prayer.textContent='Pai-Nosso';prayer.className='prayer-heading';
  text.prepend(section,prayer);title.textContent=seq[i][3];ctx.textContent='Mistérios '+names[kind];
 }
 prev.disabled=i===0;prev.onclick=()=>go(day,i-1);
 next.textContent=i===seq.length-1?'Voltar aos dias':'Avançar →';
 next.onclick=()=>i===seq.length-1?location.hash='dias':go(day,i+1);
 if(focus){title.focus({preventScroll:true});window.scrollTo(0,0);focus=false;}
}
addEventListener('hashchange',route);route();
</script></html>
